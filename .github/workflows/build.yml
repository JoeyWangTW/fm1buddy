# Builds the CYD-S3's firmware and the case's STLs. Every run keeps them as a "firmware" artifact; tags (v0.2) also
# get a release with them attached.
name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio esptool==4.8.1
      - run: pio run
      - run: |
          mkdir -p build
          cp .pio/build/cyd-s3/firmware.factory.bin build/fm1buddy-cyd-s3.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/fm1buddy-cyd-s3.bin
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            build/fm1buddy-cyd-s3.bin
          fail_on_unmatched_files: true

  cases:
    runs-on: ubuntu-latest
    container: openscad/openscad:dev.2026-09-28
    steps:
      - uses: actions/checkout@v4
      - run: tools/cases.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cases
          path: build/case/*.stl
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/case/*.stl
          fail_on_unmatched_files: true
