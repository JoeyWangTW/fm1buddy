; fm1buddy:
;
;   cyd-s3   the touch screen app (Freenove ESP32-S3 2.8" FNK0104B): pio run -e cyd-s3 -t upload
;   sim      the same app on the desktop (SDL2): pio run -e sim && .pio/build/sim/program
;   feather  the USB MIDI host box (Adafruit Feather RP2040 with USB Type A Host), with or without its own screen:
;            pio run -e feather -t upload (or copy .pio/build/feather/firmware.uf2 onto its RPI-RP2 drive)
;   pico     ultra-light: the host box on a Waveshare RP2040-Zero, its own USB-C port the host. Hold BOOT while
;            plugging it into a computer, and copy .pio/build/pico/firmware.uf2 onto its RPI-RP2 drive

[platformio]
default_envs = cyd-s3, feather, pico

; the app (src/app), shared by the board and the simulator
[app]
build_flags =
    -I src/app
    -D LV_CONF_INCLUDE_SIMPLE=1
lib_deps =
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@7.2.1

[env:cyd-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
build_src_filter = +<app/> +<s3/>
build_flags =
    ${app.build_flags}
    ; for now the USB-C port is USB serial (flashing, logs); it becomes the USB host with MIDI
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; the touch panel (FT6336, I2C)
    -D TOUCH_SDA=16
    -D TOUCH_SCL=15
    -D TOUCH_RST=18
    -D TOUCH_INT=17
    ; the SD card (4-bit SD_MMC)
    -D SD_CLK=38
    -D SD_CMD=40
    -D SD_D0=39
    -D SD_D1=41
    -D SD_D2=48
    -D SD_D3=47
    ; the RGB LED (WS2812)
    -D LED_RGB=42
    ; Bluetooth's buffers in PSRAM: the internal RAM is for Wi-Fi and the USB host
    -D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    ; TFT_eSPI, as in Freenove's FNK0104AB setup: ILI9341
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D USE_HSPI_PORT=1
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
lib_deps =
    ${app.lib_deps}
    bodmer/TFT_eSPI@2.5.43
    h2zero/NimBLE-Arduino@2.5.1

[env:sim]
platform = native
build_src_filter = +<app/> +<sim/>
build_flags =
    ${app.build_flags}
    -std=gnu++17
    !sdl2-config --cflags --libs
    -lcurl
lib_deps =
    ${app.lib_deps}

[env:feather]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = adafruit_feather_usb_host
framework = arduino
board_build.core = earlephilhower
; PIO USB needs a multiple of 12 MHz
board_build.f_cpu = 120000000L
; the USB drive (firmwares, midimap.txt): most of the 8 MB flash
board_build.filesystem_size = 7m
build_src_filter = +<common/> +<feather/>
build_flags =
    -I src/common
    -I src/feather
    -D USE_TINYUSB
    '-D CFG_TUSB_CONFIG_FILE="tusb_config_fm1buddy.h"'
    ; the screen: the Adafruit 128x64 OLED FeatherWing (SH1107). For another 128x64 I2C OLED:
    ; -D OLED_SSD1306  or  -D OLED_SH1106
    ; the buttons (to GND): the FeatherWing's A B C are up, OK, down, and holding OK is back. With a 4th button:
    ; -D BTN_BACK=10
    -D BTN_UP=9
    -D BTN_OK=6
    -D BTN_DOWN=5
    ; an SD card (optional, as on the Adalogger FeatherWing): its CS
    -D SD_CS=10
lib_deps =
    olikraus/U8g2@2.36.5

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
build_src_filter = +<common/> +<pico/> +<feather/host.cpp>
build_flags =
    -I src/common
    -I src/feather
    -I src/pico
    ; the board's own USB port is the host
    -D USE_TINYUSB
    -D USE_TINYUSB_HOST
    '-D CFG_TUSB_CONFIG_FILE="tusb_config_fm1buddy.h"'
    ; a USB stick on the hub, for midimap.txt
    -D CFG_TUH_MSC=1
    -D USE_BLOCK_DEVICE_INTERFACE=1
    ; the RGB LED (WS2812): flashes with MIDI
    -D LED_RGB=16
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3
