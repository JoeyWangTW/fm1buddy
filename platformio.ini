; fm1buddy on an ESP32-2432S028R "Cheap Yellow Display": installs FM-1 firmware from SD:/fm1 through the
; USB MIDI host box (usbhost/), wired to CN1.
;
;   pio run -e cyd -t upload -t monitor

[platformio]
src_dir = cyd
default_envs = cyd

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 460800
upload_speed = 460800
board_build.partitions = huge_app.csv

build_flags =
    -I common
    ; the link to the host box, on CN1
    -D LINK_RX=22
    -D LINK_TX=27
    ; TFT_eSPI, configured here instead of in its User_Setup.h: ILI9341 on HSPI
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D USE_HSPI_PORT=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    ; some CYD revisions (two USB ports) show inverted colors: add this
    ; -D TFT_INVERSION_ON=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

lib_deps =
    bodmer/TFT_eSPI@2.5.43
