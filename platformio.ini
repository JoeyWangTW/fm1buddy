; fm1buddy:
;
;   feather  the USB MIDI host box (Adafruit Feather RP2040 with USB Type A Host), with or without its own screen:
;            pio run -e feather -t upload (or copy .pio/build/feather/firmware.uf2 onto its RPI-RP2 drive)
;   cyd      the touch screen (ESP32-2432S028R "Cheap Yellow Display"), wired to the box's TX/RX:
;            pio run -e cyd -t upload
;   pico     ultra-light: the host box on a Waveshare RP2040-Zero, its own USB-C port the host (no USB drive, no
;            screen of its own; a CYD can still be wired to GP0/GP1). Hold BOOT while plugging it into a computer,
;            and copy .pio/build/pico/firmware.uf2 onto its RPI-RP2 drive

[platformio]
default_envs = feather, cyd, pico

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 460800
upload_speed = 460800
board_build.partitions = huge_app.csv

build_src_filter = +<common/> +<cyd/>
build_flags =
    -I src/common
    ; the link to the host box, on CN1
    -D LINK_RX=22
    -D LINK_TX=27
    ; TFT_eSPI, configured here instead of in its User_Setup.h: ILI9341 on HSPI
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D USE_HSPI_PORT=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    ; some CYD revisions (two USB ports) show inverted colors: add this
    ; -D TFT_INVERSION_ON=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.1
    h2zero/NimBLE-Arduino@2.5.1

[env:feather]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = adafruit_feather_usb_host
framework = arduino
board_build.core = earlephilhower
; PIO USB needs a multiple of 12 MHz
board_build.f_cpu = 120000000L
; the USB drive (firmwares, midimap.txt): most of the 8 MB flash
board_build.filesystem_size = 7m
build_src_filter = +<common/> +<feather/>
build_flags =
    -I src/common
    -I src/feather
    -D USE_TINYUSB
    '-D CFG_TUSB_CONFIG_FILE="tusb_config_fm1buddy.h"'
    ; the screen: the Adafruit 128x64 OLED FeatherWing (SH1107). For another 128x64 I2C OLED:
    ; -D OLED_SSD1306  or  -D OLED_SH1106
    ; the buttons (to GND): the FeatherWing's A B C are up, OK, down, and holding OK is back. With a 4th button:
    ; -D BTN_BACK=10
    -D BTN_UP=9
    -D BTN_OK=6
    -D BTN_DOWN=5
    ; an SD card (optional, as on the Adalogger FeatherWing): its CS
    -D SD_CS=10
lib_deps =
    olikraus/U8g2@2.36.5

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
build_src_filter = +<common/> +<pico/> +<feather/host.cpp>
build_flags =
    -I src/common
    -I src/feather
    -I src/pico
    ; the board's own USB port is the host
    -D USE_TINYUSB
    -D USE_TINYUSB_HOST
    '-D CFG_TUSB_CONFIG_FILE="tusb_config_fm1buddy.h"'
    ; a USB stick on the hub, for midimap.txt
    -D CFG_TUH_MSC=1
    -D USE_BLOCK_DEVICE_INTERFACE=1
    ; the RGB LED (WS2812): flashes with MIDI
    -D LED_RGB=16
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3
