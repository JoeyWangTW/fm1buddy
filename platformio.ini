; fm1buddy:
;
;   cyd-s3   the touch screen app (Freenove ESP32-S3 2.8" FNK0104B): pio run -e cyd-s3 -t upload
;   sim      the same app on the desktop (SDL2): pio run -e sim && .pio/build/sim/program

[platformio]
default_envs = cyd-s3

; the app (src/app), shared by the board and the simulator
[app]
build_flags =
    -I src/app
    -D LV_CONF_INCLUDE_SIMPLE=1
lib_deps =
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@7.2.1

[env:cyd-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
build_src_filter = +<app/> +<s3/>
build_flags =
    ${app.build_flags}
    ; crashes kept for the log (hal_s3.cpp onPanic): Arduino's panic hook is a wrapper the link has to ask for
    -Wl,--wrap=esp_panic_handler
    ; for now the USB-C port is USB serial (flashing, logs); it becomes the USB host with MIDI
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; the touch panel (FT6336, I2C)
    -D TOUCH_SDA=16
    -D TOUCH_SCL=15
    -D TOUCH_RST=18
    -D TOUCH_INT=17
    ; the SD card (4-bit SD_MMC)
    -D SD_CLK=38
    -D SD_CMD=40
    -D SD_D0=39
    -D SD_D1=41
    -D SD_D2=48
    -D SD_D3=47
    ; the RGB LED (WS2812)
    -D LED_RGB=42
    ; Bluetooth's buffers in PSRAM: the internal RAM is for Wi-Fi and the USB host
    -D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    ; the USB host: TinyUSB (src/s3/tusb_config_fm1buddy.h)
    -I src/s3
    '-D CFG_TUSB_CONFIG_FILE="tusb_config_fm1buddy.h"'
    ; TFT_eSPI, as in Freenove's FNK0104AB setup: ILI9341
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D USE_HSPI_PORT=1
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
lib_deps =
    ${app.lib_deps}
    bodmer/TFT_eSPI@2.5.43
    h2zero/NimBLE-Arduino@2.5.1
    https://github.com/hathach/tinyusb.git#0.21.0

[env:sim]
platform = native
build_src_filter = +<app/> +<sim/>
build_flags =
    ${app.build_flags}
    -std=gnu++17
    !sdl2-config --cflags --libs
    -lcurl
lib_deps =
    ${app.lib_deps}

; Diagnostic build for Joey's Hosyond ES3C28P. No firmware installs or recovery flash writes.
[env:hosyond-diagnostic]
extends = env:cyd-s3
upload_speed = 115200
build_flags =
    ${env:cyd-s3.build_flags}
    -D FM1BUDDY_RECOVERY_READ_ONLY=1
    -D FM1BUDDY_SD_ONE_BIT=1
    -D FM1BUDDY_RECOVERY_IDF=1

; Hosyond: Hub installs + guarded stock V15 recovery; diagnostic stays read-only.
[env:hosyond-recovery]
extends = env:cyd-s3
upload_speed = 115200
build_flags =
    ${env:cyd-s3.build_flags}
    -D FM1BUDDY_SD_ONE_BIT=1
    -D FM1BUDDY_RECOVERY_IDF=1
    -D FM1BUDDY_STOCK_RESTORE=1
